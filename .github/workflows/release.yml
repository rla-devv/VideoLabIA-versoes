# Cria a Release de cada versão do Vídeo Lab IA (com a tag vX.Y.Z) quando o publicar.py do código-fonte envia uma versão nova:
# o commit muda o release.json, a lista dos arquivos da Release (o instalador .zip e os arquivos que a instalação e a
# atualização baixam). O GitHub conta os downloads de cada um. Se a Release da versão já existe, só atualiza os arquivos.
name: Release
on:
  push:
    branches: [main]
    paths: ['release.json', '.github/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar a Release com os arquivos da versão
        env:
          GH_TOKEN: ${{ github.token }}
          ALVO: ${{ github.sha }}
        run: python3 .github/release.py
