# Cria a Release de cada versão do Vídeo Lab IA quando chega a tag vX.Y.Z (enviada pelo publicar.py do código-fonte).
# Os arquivos saem do próprio repositório, pela lista release.json do commit da tag: o instalador (.zip) e os arquivos
# que a instalação e a atualização baixam. O GitHub conta os downloads de cada um.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar a Release com os arquivos da versão
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 .github/release.py
